name: API Image for Coolify

on:
  push:
    branches: [development, main]

    paths:
      - apps/api/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/api-image-coolify.yml
  workflow_dispatch:

concurrency:
  group: api-image-coolify-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/nexo-api

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          BRANCH_TAG="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')"
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${BRANCH_TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.branch_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-coolify:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL || 'https://coolify.gruporedux.com.br' }}
      COOLIFY_PREVIEW_UUID: q3cmcm9u39q6o1pk8qlnha9x
      COOLIFY_PRODUCTION_UUID: ki9858xcvpezsso8kmwgpk6a
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

    steps:
      - name: Determine app UUID
        id: app
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "uuid=${{ env.COOLIFY_PRODUCTION_UUID }}" >> "$GITHUB_OUTPUT"
          else
            echo "uuid=${{ env.COOLIFY_PREVIEW_UUID }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Coolify token
        if: ${{ env.COOLIFY_API_TOKEN == '' }}
        run: |
          echo "COOLIFY_API_TOKEN is not configured. Skipping deploy."
          exit 0

      - name: Trigger deploy via Coolify API
        run: |
          DEPLOY_URL="${{ env.COOLIFY_API_URL }}/api/v1/deploy?uuid=${{ steps.app.outputs.uuid }}"
          echo "Deploying: ${{ steps.app.outputs.uuid }} (${{ github.ref_name }})"
          RESULT=$(curl -sf -X POST \
            -H "Authorization: Bearer ${{ env.COOLIFY_API_TOKEN }}" \
            "$DEPLOY_URL")
          echo "Result: $RESULT"
